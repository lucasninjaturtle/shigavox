[project]
name = "shigavox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucas Agueero", email = "lucas.agueero@digitalhub.man" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "fastapi[standard]>=0.141.1",
    "kokoro>=0.9.4",
    "numpy>=2.5.2",
    "ollama>=0.6.3",
    "soundfile>=0.14.0",
]

[project.scripts]
shigavox-main = "shigavox:main"
shigavox-dev = "shigavox.dev:main"
shigavox = "shigavox.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
